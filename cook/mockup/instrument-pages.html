<title>Stock Council Instrument</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: page tabs + Desktop/Phone switch on top; each page drawn in a frame whose width drives the layout (container queries). */
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#0f1724; --surf:#141e2d; --raise:#1a2638; --ink:#e7ecf3; --mute:#8f9cb0; --faint:#5d6b80; --line:#23314a; --line2:#2d3d58;
  --buy:#4ade80; --hold:#fbbf24; --sell:#fb8a5a; --split:#cbd5e1; --price:#f59e5b; --focus:#7aa2f7;
  --c-prom:#7aa2f7; --c-fii:#2dd4bf; --c-dii:#f472b6; --c-govt:#94a3b8; --c-pure:#fbbf24; --c-named:#475569;
  --on-accent:#0b1220;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5f8; --surf:#ffffff; --raise:#f7f9fb; --ink:#15202e; --mute:#5f6b7a; --faint:#8a94a3; --line:#e2e7ee; --line2:#d3dae4;
  --buy:#15803d; --hold:#b45309; --sell:#c2410c; --split:#475569; --price:#c2611a; --focus:#3b63c9;
  --c-prom:#3b63c9; --c-fii:#0f8f80; --c-dii:#db2777; --c-govt:#64748b; --c-pure:#b7791f; --c-named:#cbd5e1;
  --on-accent:#ffffff; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f3f5f8; --surf:#ffffff; --raise:#f7f9fb; --ink:#15202e; --mute:#5f6b7a; --faint:#8a94a3; --line:#e2e7ee; --line2:#d3dae4;
  --buy:#15803d; --hold:#b45309; --sell:#c2410c; --split:#475569; --price:#c2611a; --focus:#3b63c9;
  --c-prom:#3b63c9; --c-fii:#0f8f80; --c-dii:#db2777; --c-govt:#64748b; --c-pure:#b7791f; --c-named:#cbd5e1;
  --on-accent:#ffffff; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)} .mute{color:var(--mute)} .faint{color:var(--faint)}
.good{color:var(--buy)} .warn{color:var(--hold)} .bad{color:var(--sell)} .split{color:var(--split)}
.bg-good{background:var(--buy)} .bg-warn{background:var(--hold)} .bg-bad{background:var(--sell)} .bg-split{background:var(--split)} .bg-none{background:var(--line2)}
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--faint)}

/* ---------- picker (outside the mock) ---------- */
.pick{max-width:1240px;margin:0 auto 14px;display:flex;flex-direction:column;gap:10px}
.pick h1{font-size:19px;font-weight:600}
.pick p{margin:0;color:var(--mute);font-size:14px;max-width:70ch}
.pickrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pages{display:flex;gap:4px;flex-wrap:wrap}
.pages button,.widths button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13.5px;cursor:pointer;color:var(--mute)}
.pages button[aria-pressed="true"],.widths button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--surf)}
.widths{display:flex;gap:4px}
.note{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:0;list-style:none}
.note li::before{content:"→ ";color:var(--faint)}
.stagewrap{display:flex;justify-content:center}
.frame{container-type:inline-size;width:100%;max-width:1240px;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--bg);position:relative}
.frame.phone{max-width:390px;border-radius:28px}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- the site: shell ---------- */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15.5px;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:6px;background:var(--ink);display:grid;place-items:center}
.mkt{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px}
.mkt span{padding:3px 9px;border-radius:6px;font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.mkt span.on{background:var(--raise);color:var(--ink)}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;font-size:14px;color:var(--mute)}
.nav a.on{color:var(--ink);background:var(--raise)}
.nav svg{width:17px;height:17px}
.content{max-width:1200px;margin:0 auto;padding:22px 24px 34px;display:flex;flex-direction:column;gap:16px}
.foot{text-align:center;font-size:12px;color:var(--faint);padding:0 0 20px}
@container (max-width:700px){
  .top{justify-content:space-between;padding:10px 16px}
  .nav{position:absolute;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--surf);border-top:1px solid var(--line);padding:6px 4px 10px;z-index:3}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:4px 6px;background:none!important}
  .nav a.on{color:var(--ink)}
  .content{padding:16px 14px 90px;gap:14px}
  .foot{padding-bottom:84px}
}

/* ---------- instrument components ---------- */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);min-height:46px}
.ph h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ph h3 svg{width:16px;height:16px;color:var(--mute)}
.ph .r{font:12px var(--mono);color:var(--mute);display:flex;gap:10px;align-items:center}
.pb{padding:14px 16px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11.5px var(--sans);padding:2px 8px;border-radius:5px;background:color-mix(in srgb,currentColor 13%,transparent);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:0;border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg span{padding:4px 10px;border-radius:6px;font-size:13px;color:var(--mute)}
.seg span.on{background:var(--raise);color:var(--ink)}
.gauge{position:relative;height:5px;border-radius:3px;background:var(--line)}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.gauge u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.65}
.gl{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--faint)}
.votes{display:flex;gap:2px}
.votes i{width:9px;height:14px;border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>div{padding:13px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.grid.c4>div:nth-child(4n){border-right:0}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))} .grid.c2>div:nth-child(2n){border-right:0}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))} .grid.c3>div:nth-child(3n){border-right:0}
.grid.c5{grid-template-columns:repeat(5,minmax(0,1fr))} .grid.c5>div:nth-child(5n){border-right:0}
.grid>div.last{border-bottom:0}
.lab{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute);align-items:center}
.val{font:500 21px var(--mono);letter-spacing:-.02em;white-space:nowrap}
.val small{font-size:12.5px;color:var(--mute);margin-left:3px;letter-spacing:0}
.rows>a,.rows>div{display:grid;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line)}
.rows>:last-child{border-bottom:0}
.rows .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .nm span{font:12px var(--mono);color:var(--mute)}
.score{display:flex;flex-direction:column;gap:4px;width:74px}
.score b{font:500 16px var(--mono);text-align:right} .score b small{font-size:11px;color:var(--faint)}
.chev{color:var(--faint);width:16px;height:16px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font:500 11.5px var(--sans);color:var(--mute);text-align:right;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--raise)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);white-space:nowrap}
table.t td:first-child{font-family:var(--sans)}
table.t tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.two.scr{grid-template-columns:minmax(0,1fr) minmax(0,2fr)} .two.even{grid-template-columns:1fr 1fr}
.grid.c7{grid-template-columns:repeat(7,minmax(0,1fr))} .grid.c7>div:nth-child(7n){border-right:0}
.show-s{display:none}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.pagehead p{margin:2px 0 0;color:var(--mute);font-size:14px}
.ask{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:5px 5px 5px 12px;min-width:min(340px,100%)}
.ask input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:inherit;outline:none;padding:6px 0}
.ask svg{width:16px;height:16px;color:var(--mute)}
.ask .btn{padding:7px 12px}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.funnel>div{padding:12px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.funnel>div:last-child{border-right:0}
.funnel .bar{height:5px;border-radius:3px;background:var(--focus)}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 15px var(--mono)}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px}
.hdr h2{font-size:23px;font-weight:600}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font:13px var(--mono);color:var(--mute);margin-top:4px}
.verdict{display:flex;align-items:center;gap:14px}
.verdict strong{font-size:18px;display:block}
.verdict span{font-size:13px;color:var(--mute)}
.stats{border-top:1px solid var(--line)}
.risk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.risk>div{padding:12px 18px;font-size:14px;display:flex;gap:10px}
.risk>div+div{border-left:1px solid var(--line)}
.risk svg{width:16px;height:16px;flex:none;margin-top:2px}
.risk b{font-weight:600}
.now{display:flex;height:28px;border-radius:6px;overflow:hidden;gap:2px}
.now div{display:flex;align-items:center;justify-content:center;font:600 11px var(--mono);color:var(--on-accent);min-width:0;overflow:hidden;white-space:nowrap}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--mute)}
.keys span{display:flex;align-items:center;gap:6px}
.keys b{font:500 13px var(--mono);color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.member{display:grid;grid-template-columns:92px minmax(0,1fr) 110px 46px 16px;gap:12px;align-items:center}
.member .bar{height:5px;border-radius:3px;background:var(--line);position:relative}
.member .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.member em{font:normal 500 14px var(--mono);text-align:right}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mute)}
.input{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:14px var(--mono);color:var(--ink);background:var(--bg);display:flex;justify-content:space-between;align-items:center}
.input.ph{color:var(--faint)}
.tog{width:38px;height:22px;border-radius:11px;background:var(--line2);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink)}
.tog.on{background:var(--buy)} .tog.on::after{left:19px;background:var(--on-accent)}
.set>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.set>div:last-child{border-bottom:0}
.set b{font-weight:500;display:block}
.set span.s{font-size:13px;color:var(--mute)}
.days{display:flex;gap:3px}
.days i{font:normal 600 11.5px var(--sans);width:30px;height:28px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line2);color:var(--mute)}
.days i.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.steps>div{padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.steps>div:last-child{border-right:0}
.steps .bar{height:4px;border-radius:2px;background:var(--line)}
.steps .bar i{display:block;height:100%;border-radius:2px;background:var(--buy)}
.slots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.slots div{border:1px solid var(--line);border-radius:7px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute)}
.slots div b{font:500 13px var(--mono);color:var(--ink)}
.slots div.wait{border-style:dashed}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.rules>div{display:grid;grid-template-columns:minmax(0,1fr) 92px 110px 28px;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);align-items:center}
.rules>div:last-child{border-bottom:0}
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.presets span{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13.5px;white-space:nowrap;color:var(--mute)}
.presets span.on{border-color:var(--ink);color:var(--ink);background:var(--surf)}
.cb{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;display:inline-block}
.cb.on{background:var(--focus);border-color:var(--focus)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.flow>div{padding:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.flow>div:last-child{border-right:0}
.flow .n{font:500 26px var(--mono);letter-spacing:-.02em}
.flow h4{font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.flow h4 svg{width:17px;height:17px;color:var(--mute)}
.flow p{margin:0;font-size:13.5px;color:var(--mute)}
.upd{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:5;white-space:nowrap}
.upd svg{width:16px;height:16px}
.upd .btn{background:var(--bg);color:var(--ink);padding:6px 12px}
.upd .x{opacity:.6;padding:4px;cursor:pointer;background:none;border:0;color:inherit}

@container (max-width:900px){
  .two,.two.scr,.two.even{grid-template-columns:1fr}
}
@container (max-width:700px){
  .grid.c4,.grid.c5,.grid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.c4>div:nth-child(4n),.grid.c5>div:nth-child(5n),.grid.c3>div:nth-child(3n){border-right:1px solid var(--line)}
  .grid>div:nth-child(2n){border-right:0!important}
  .funnel,.flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .funnel>div:nth-child(2),.flow>div:nth-child(2){border-right:0}
  .funnel>div:nth-child(-n+2),.flow>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .hdr{grid-template-columns:1fr}
  .risk{grid-template-columns:1fr} .risk>div+div{border-left:0;border-top:1px solid var(--line)}
  .member{grid-template-columns:78px minmax(0,1fr) 40px 14px} .member .bar{display:none}
  .steps{grid-template-columns:repeat(5,minmax(0,1fr))} .steps>div{padding:10px 6px} .steps .lbl{font-size:11px}
  .slots{grid-template-columns:repeat(7,minmax(0,1fr))} .slots div span{display:none}
  .rules>div{grid-template-columns:minmax(0,1fr) 70px 70px 24px;padding:8px 12px}
  .hide-s{display:none!important} .show-s{display:inline!important}
  .grid.c7{grid-template-columns:repeat(4,minmax(0,1fr))} .grid.c7>div{border-bottom:1px solid var(--line)!important}
  .pagehead h2{font-size:20px}
  .upd{bottom:76px}
}
</style>

<div class="pick">
  <h1>Stock Council in the Instrument style</h1>
  <p>Every page of the site, India and US, with real numbers from the 23 Nov run. Switch pages and widths below. The dark bar at the bottom is the new "update ready" prompt.</p>
  <div class="pickrow">
    <div class="pages" id="pages"></div>
    <div class="widths"><button data-w="desk" aria-pressed="true">Desktop</button><button data-w="phone" aria-pressed="false">Phone</button></div>
  </div>
  <ul class="note" id="note"></ul>
</div>
<div class="stagewrap"><div class="frame" id="frame"></div></div>

<script>

  shield:'<path d="M12 3.5 5 6v5.5c0 4 3 7.3 7 9 4-1.7 7-5 7-9V6z"/><path d="m9 12 2 2 4-4"/>',

  news:'<path d="M5 5h11v14H6a1 1 0 0 1-1-1zM16 9h3v9a1 1 0 0 1-2 0"/><path d="M8 9h5M8 12h5M8 15h3"/>',

];
let page = 0, width = 'desk';

document.getElementById('pages').innerHTML = PAGES.map((p, i) => `<button data-p="${i}" aria-pressed="${i === 0}">${p[0]}</button>`).join('');

function draw() {
  document.querySelectorAll('[data-p]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.p === page));
  document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === width));
  frame.className = 'frame' + (width === 'phone' ? ' phone' : '');
  try { frame.innerHTML = PAGES[page][1](); } catch (e) { frame.innerHTML = `<p style="padding:20px">Could not draw this page: ${e.message}</p>`; }
  note.innerHTML = PAGES[page][2].map(t => `<li>${t}</li>`).join('');
  try { localStorage.setItem('pg', page); localStorage.setItem('w', width); } catch (e) {}
}
document.getElementById('pages').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { page = +b.dataset.p; draw(); } });
document.querySelector('.widths').addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (b) { width = b.dataset.w; draw(); } });
