[project]
name = "stock-council"
version = "0.1.0"
description = "Daily Indian stock volume-shock screen with a council of AI analysts"
readme = "README.md"
authors = [{ name = "Parth Chandak" }]
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.17.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
    "pandas>=3.1.1",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
    "yfinance>=1.8.0",
]

[project.scripts]
stock-council = "stock_council:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
